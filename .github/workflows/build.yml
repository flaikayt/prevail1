name: Build Prevail
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        shell: bash
        run: |
          unzip -q "$(ls *.zip | head -n 1)" -d work
          PROJ="$(dirname "$(find work -name settings.gradle -not -path '*/mdk/*' | head -n 1)")"
          cd "$PROJ"
          MDG=$(curl -s https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml | grep -o '<release>[^<]*' | sed 's/<release>//')
          NEO=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -o '<version>26\.2\.[^<]*' | sed 's/<version>//' | tail -n 1)
          echo "ModDevGradle: $MDG  NeoForge: $NEO"
          sed -i "s/\(id 'net.neoforged.moddev' version '\)[^']*'/\1$MDG'/" build.gradle
          sed -i "s/^neo_version=.*/neo_version=$NEO/" gradle.properties
          set +e
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew build 2>&1 | tee build.log; else gradle build 2>&1 | tee build.log; fi
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" != "0" ]; then
            echo "================ ОШИБКИ ================"
            grep -A4 "error:" build.log | head -400
            echo "## Ошибки компиляции" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -A4 "error:" build.log | head -400 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $CODE
      - uses: actions/upload-artifact@v4
        with:
          name: prevail-jar
          path: work/**/build/libs/*.jar
